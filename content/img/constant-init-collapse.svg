  <text x="116" y="48" class="txt" font-size="12" text-anchor="middle">W<tspan dy='4' font-size='9'>1</tspan></text>
  <text x="238" y="62" class="txt" font-size="12" text-anchor="middle">W<tspan dy='4' font-size='9'>2</tspan></text>
  <text x="505" y="86" class="txt" font-size="12" text-anchor="middle">W<tspan dy='4' font-size='9'>1</tspan></text>
  <text x="632" y="90" class="txt" font-size="12" text-anchor="middle">M · W<tspan dy='4' font-size='9'>2</tspan></text>
  <text x="178" y="181" class="txt" font-size="22" text-anchor="middle">···</text>
  <text x="62" y="218" class="txt" font-size="12" text-anchor="middle">вход</text>
  <text x="178" y="252" class="txt" font-size="12" text-anchor="middle">скрытые</text>
  <text x="298" y="192" class="txt" font-size="12" text-anchor="middle">выход</text>
  <text x="452" y="218" class="txt" font-size="12" text-anchor="middle">вход</text>
  <text x="568" y="172" class="txt" font-size="12" text-anchor="middle">скрытый</text>
  <text x="688" y="192" class="txt" font-size="12" text-anchor="middle">выход</text>
  <text x="178" y="285" class="txt-strong" font-size="13" text-anchor="middle">M нейронов, все веса одинаковы</text>
  <text x="568" y="285" class="txt-strong" font-size="13" text-anchor="middle">один нейрон, выходные веса ×M</text>
  <text x="376" y="112" class="txt" font-size="11" text-anchor="middle">это то же, что</text>
