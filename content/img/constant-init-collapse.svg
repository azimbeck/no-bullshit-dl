<svg id="fig-collapse" aria-labelledby="fig-collapse-title fig-collapse-desc" viewBox="0 0 750 310" xmlns="http://www.w3.org/2000/svg" role="img" style="width: 100%; height: auto;">
  <title id="fig-collapse-title">Константная инициализация схлопывает скрытый слой</title>
  <desc id="fig-collapse-desc">Слева сеть с M одинаковыми скрытыми нейронами, справа эквивалентная сеть с одним скрытым нейроном и выходными весами, умноженными на M.</desc>
  <defs>
    <mask id="fig-collapse-gaps" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="750" height="310" fill="white"/>
      <rect x="104.0" y="37.0" width="24.0" height="15" fill="black" rx="2"/>
      <rect x="226.0" y="51.0" width="24.0" height="15" fill="black" rx="2"/>
      <rect x="493.0" y="75.0" width="24.0" height="15" fill="black" rx="2"/>
      <rect x="607.0" y="79.0" width="50.0" height="15" fill="black" rx="2"/>
      <rect x="162.0" y="160.0" width="32.0" height="25" fill="black" rx="2"/>
    </mask>
    <marker id="fig-collapse-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/>
    </marker>
  </defs>
  <style>
    #fig-collapse { font-family: var(--bodyFont); }
    #fig-collapse .node { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }
    #fig-collapse .node-t { fill: #FAECE7; stroke: #993C1D; stroke-width: 1; }
    #fig-collapse .e1 { stroke: #D85A30; fill: none; }
    #fig-collapse .e2 { stroke: #1D9E75; fill: none; }
    #fig-collapse .neutral { stroke: #B4B2A9; fill: none; }
    #fig-collapse .arrowhead { fill: #B4B2A9; }
    #fig-collapse .txt { fill: #52514E; }
    #fig-collapse .txt-strong { fill: #0B0B0B; font-weight: 500; }
    :root[saved-theme="dark"] #fig-collapse .node { fill: #3A3A38; stroke: #9A9A94; }
    :root[saved-theme="dark"] #fig-collapse .node-t { fill: #4A2418; stroke: #D85A30; }
    :root[saved-theme="dark"] #fig-collapse .neutral { stroke: #6E6D68; }
    :root[saved-theme="dark"] #fig-collapse .arrowhead { fill: #6E6D68; }
    :root[saved-theme="dark"] #fig-collapse .txt { fill: #B4B2A9; }
    :root[saved-theme="dark"] #fig-collapse .txt-strong { fill: #EDEDEA; }
  </style>
